<html lang="am">
<head>
<meta charset="utf-8">
<title>EarnTask</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f0f2f8;--card:#fff;--tx:#1b2238;--mu:#6b7390;--ac:#4f8ef7;--bd:#e1e5f0;--ok:#1fa971;--gold:#f5b400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131d;--card:#1a1f2e;--tx:#eef1fa;--mu:#98a0bc;--bd:#2a3146}}
:root[data-theme="dark"]{--bg:#10131d;--card:#1a1f2e;--tx:#eef1fa;--mu:#98a0bc;--bd:#2a3146}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Ethiopic","Segoe UI",system-ui,sans-serif;min-height:100vh;padding-bottom:76px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:10px 14px;z-index:5}
.logo{font-weight:800;color:var(--ac);font-size:20px;margin-inline-end:auto}
.pill{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 12px;font:inherit;font-size:13px;text-decoration:none;display:inline-block}
.pill.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chip{color:var(--gold);font-weight:700}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:4px 0 12px;font-size:18px}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 6px}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row select{width:46%}
button.big{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700}
button.big.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.45}
.task{display:flex;align-items:center;gap:10px;justify-content:space-between}
.task small{color:var(--mu);display:block;margin-top:3px;min-height:1.2em}
.rew{color:var(--ok);font-weight:700}
.bar{height:6px;background:var(--bd);border-radius:6px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width 1s linear}
.btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.btns .pill,.btns button{flex:1;text-align:center}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 2px;font:inherit;font-size:12px}
nav button.on{color:var(--ac);font-weight:700}
.msg{font-size:13px;color:var(--mu);margin-top:8px}
.note{background:rgba(245,180,0,.12);border:1px solid var(--gold);border-radius:12px;padding:10px;font-size:13px;margin-bottom:12px}
.hide{display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mth{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:13px;text-align:start}
.mth.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.mth img,.bn{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none}
.bn{background:#f0b90b;color:#111;display:grid;place-items:center;font-style:normal;font-weight:800}
.acc{display:block;width:100%;text-align:start;margin-top:8px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
</style>
</head>

function paint(){if(S.tab!=="home"||!S.me||!$("#fi"))return;const now=Date.now()+S.skew;
 for(const k in S.cfg.tasks){const x=S.cfg.tasks[k],ti=S.me.tasks[k],l=ti.last,fl=S.flash[k];let txt="",p=0,op=true,sh=false;
  if(l&&l.status!=="rejected"&&now-l.t<DAY){op=false;p=100;txt=(l.status==="pending"?"⏳ "+t("pend"):"✅ "+t("appr"))+" · "+t("cool")+" "+cd(DAY-(now-l.t))}
  else{if(l&&l.status==="rejected"&&!(ti.started>l.t))txt="❌ "+t("rej");
   if(ti.started>0&&(!l||ti.started>l.t||l.status==="rejected")){const e=(now-ti.started)/1000;p=Math.min(100,e/x.w*100);if(e<x.w)txt="⏳ "+t("left",{s:Math.ceil(x.w-e)});else{txt="📷 "+t("sendshot");sh=true}}}
  if(fl&&fl[1]>Date.now())txt=fl[0];
  $("#s-"+k).textContent=txt;$("#b-"+k).style.width=p+"%";$("#o-"+k).disabled=!op;$("#c-"+k).disabled=!sh}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.me)poll()});
setInterval(()=>{if(S.me&&!document.hidden)poll()},20000);
{const th=load("et_theme",null);if(th)document.documentElement.dataset.theme=th}
(async()=>{try{S.cfg=await api("config")}catch(e){$("#app").textContent="Server error";return}
 if(tok){try{S.me=await api("me");S.skew=S.me.now-Date.now()}catch(e){tok="";save("et_tok","")}}
 setLang(S.lang)})();
</script>
